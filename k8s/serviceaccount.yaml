# Workload identity for the Key Rotation section (MLC-2635).
#
# The portal needs to read and write secrets in the two CI/CD Key Vaults. Rather than put a client
# secret in a Kubernetes Secret, the pod exchanges a projected service-account token for an Azure
# token - so there is no credential to store, and nothing to rotate here.
#
# Set up on 2026-10-09:
#   managed identity  id-deploy-portal-keyvault  (rg-mepu-common-uaenorth-001)
#   clientId          f9c3a710-e6f2-493f-897e-c931b97af090
#   roles             Key Vault Secrets Officer on kv-cicd-uat-uaenorth and kv-cicd-prod-uaenorth
#   federated cred    deploy-portal-keyvault, subject
#                     system:serviceaccount:deploy-portal:deploy-portal-keyvault
#
# A user-assigned managed identity was chosen over an app registration deliberately: creating an
# app registration needs Entra rights this account does not have as a guest in the Magraby tenant,
# whereas a managed identity is an ordinary Azure resource. OIDC issuer and workload identity were
# already enabled on aks-ecom-common-uaenorth-001, so no cluster change was needed.
#
# The subject string below must match the federated credential exactly. Renaming this service
# account, or moving the pod to another namespace, breaks the token exchange and the Key Rotation
# section reports itself as not connected.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-portal-keyvault
  namespace: deploy-portal
  annotations:
    azure.workload.identity/client-id: f9c3a710-e6f2-493f-897e-c931b97af090
  labels:
    app: magrabi-deploy-portal
